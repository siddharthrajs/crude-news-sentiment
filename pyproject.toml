[project]
name = "crude-news-sentiment"
version = "0.1.0"
description = "Real-time crude oil / geopolitics news sentiment pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "APScheduler>=3.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Zero-shot relevance. Heavy (~2GB) and not needed to run the pipeline, so it
# is kept out of the base install.
ml = [
    "torch>=2.2",
    "transformers>=4.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
