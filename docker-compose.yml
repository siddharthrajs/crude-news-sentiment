services:
  app:
    build:
      context: .
      args:
        # 1 includes the zero-shot model (~2GB image, ~2GB RAM at runtime).
        INSTALL_ML: ${INSTALL_ML:-0}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cns:${POSTGRES_PASSWORD}@db:5432/cns
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ZEROSHOT_ENABLED: ${ZEROSHOT_ENABLED:-false}
      # Cache weights on a volume so redeploys do not re-download 1.6GB.
      HF_HOME: /app/data/hf
    volumes:
      - modelcache:/app/data/hf
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cns
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cns -d cns"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  modelcache:
